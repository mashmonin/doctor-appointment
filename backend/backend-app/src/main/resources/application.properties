spring.application.name=da-backend

server.port=8080

# Logging
logging.level.root=INFO
logging.level.org=INFO
logging.level.org.springframework.web=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.mvc.log-request-details=true
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.sql=INFO

# Logger settings
#logger.dir=./logs
#logger.file=application.log
#logger.file.json=application.log.json
#logger.module.id=@project.name@
#logger.module.version=@project_version@

# Rest Template
#connection-request-timeout=60000
#read-timeout = 120000

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:doctor_appointment}
spring.datasource.username=${DB_USER:demo_user}
spring.datasource.password=${DB_PASSWORD:new_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase properties
spring.liquibase.change-log=classpath:/liquibase/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.user=${DB_USER:demo_user}
spring.liquibase.password=${DB_PASSWORD:new_password}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.example.backend,com.example.backend.api
springdoc.model-packages-to-scan=com.exam/gple.backend.api.dto

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.web.resources.add-mappings=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true