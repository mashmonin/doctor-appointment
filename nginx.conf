events {
    worker_connections 1024;
}

http {
    # Настройки сжатия gzip
    gzip on;
    gzip_types text/plain application/javascript application/json text/css image/svg+xml;
    gzip_min_length 1000;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    # Общие правила сервера
    server {
        listen 80;
        server_name lava-med.ru www.lava-med.ru;
        
        # Перенаправление запросов на HTTPS
        return 301 https://$host$request_uri;
    }

    # Основной сервер с поддержкой HTTPS
    server {
        listen 443 ssl;
        server_name lava-med.ru www.lava-med.ru;

        # Настройка сертификатов Let's Encrypt
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Параметры шифрования
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=31536000";

        location / {
            proxy_pass http://da-frontend:3000/;
        }

        location /api/ {
            proxy_pass http://da-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройка CORS
            add_header 'Access-Control-Allow-Origin' 'https://lava-med.ru';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';

            # Обработка метода OPTIONS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://lava-med.ru';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }
        }
    }
}